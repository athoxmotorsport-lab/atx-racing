name: Verify ATX Racing optimized assets
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atx-assets-verify-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tool
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify minified assets, ranking, profile, navigation and notifications
        run: node scripts/test-assets.mjs
